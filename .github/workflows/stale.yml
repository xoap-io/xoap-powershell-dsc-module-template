---
name: 'Stale Issue Management'
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had activity in 90 days. It will be closed if no further activity occurs within 7 days.'
          stale-pr-message: 'This pull request has been automatically marked as stale because it has not had activity in 90 days. It will be closed if no further activity occurs within 7 days.'
          close-issue-message: 'This issue was closed due to inactivity.'
          close-pr-message: 'This pull request was closed due to inactivity.'
          days-before-stale: 90
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security'
